# Supabase project configuration
# Generated by Budget Buddy AI Coach setup
# Run `supabase link --project-ref <ref>` to link to your remote project.

[api]
enabled = true

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ── Edge Functions ──────────────────────────────────────────────
# The ai-coach function MUST verify JWT so anonymous/guest calls are rejected.

[functions.ai-coach]
verify_jwt = true

# The kb-ingest function uses x-ingest-secret header authentication instead of user JWTs.
[functions.kb-ingest]
verify_jwt = false


